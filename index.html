<style>

*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh;padding-bottom:30px}

.top .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{width:50px;height:50px;border-radius:14px;background:#fff;object-fit:contain;padding:3px;flex-shrink:0}
.top .title{font-size:1.15rem;font-weight:800;line-height:1.3}.top .school{font-size:.72rem;opacity:.9}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}

.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.acc{background:var(--a)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:11px}.btn.big{width:100%;padding:14px;font-size:1.05rem;margin:6px 0}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}

.hero{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:1.45rem;line-height:1.35}.hero p{margin:6px 0 0;color:var(--mut)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.role{border:2px solid var(--bd);background:var(--bg);border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:.9rem}

.week{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--p),#8b5cf6);color:#fff;border-radius:22px;padding:18px;cursor:pointer;box-shadow:0 10px 24px rgba(91,75,225,.25)}
.week .wi{font-size:2.3rem;background:rgba(255,255,255,.18);border-radius:16px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.week b{font-size:1.15rem;display:block}.week small{opacity:.9}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}

.unit{margin-bottom:16px}.unit>h3{display:flex;align-items:center;gap:8px;margin:0 4px 6px}
.chap{font-size:.82rem;color:var(--mut);font-weight:700;margin:10px 4px 6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lcard{position:relative;background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--c,var(--p));border-radius:18px;padding:12px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.lcard:active{transform:scale(.97)}.lcard .li{font-size:1.7rem}.lcard b{display:block;font-size:.95rem;line-height:1.35;margin:2px 0}
.lcard small{color:var(--mut);font-size:.72rem}.lcard .soon{position:absolute;top:8px;left:8px;font-size:.66rem;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:0 7px}
.lhead{background:linear-gradient(120deg,var(--p),#8b5cf6);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}
.lhead .crumb{font-size:.78rem;opacity:.9}.lhead h1{margin:4px 0;font-size:1.4rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:800;font-size:.88rem}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.item .ih{display:flex;align-items:center;gap:10px;margin-bottom:8px}.item .ih .ic{font-size:1.5rem}.item .ih b{flex:1}
.embed{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed.doc{padding-top:120%;background:var(--bg)}
.txt{white-space:pre-wrap;line-height:1.9}.txt ul{margin:0;padding-right:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:800;box-shadow:var(--sh)}
.tile .ic{display:block;font-size:2rem;margin-bottom:4px}.tile small{display:block;color:var(--mut);font-weight:500;font-size:.75rem}
.q{margin:12px 0;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--bd)}.qt{font-weight:800;margin-bottom:8px}
.opt{display:flex;align-items:center;padding:11px 13px;margin:7px 0;border-radius:13px;border:2px solid var(--bd);background:var(--card);cursor:pointer;font-weight:600}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--p);transition:width .3s}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.72rem;font-weight:700;background:var(--bg);border:1px solid var(--bd)}
.pill.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}.pill.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}.pill.bad{background:#ffe4e6;color:#9f1239;border-color:#fecdd3}
.flash{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;font-weight:700;cursor:pointer;border-radius:22px;padding:22px;background:var(--card);border:3px solid var(--p);white-space:pre-wrap;user-select:none}
.flash.back{background:var(--p);color:#fff}
.chal .opt{font-weight:700}
.boardrow{display:flex;align-items:center;gap:10px;margin:8px 0}.boardrow b{min-width:48px}
.stars{display:flex;gap:6px;justify-content:center;direction:ltr}.stars button{font-size:2rem;background:none;border:0;cursor:pointer;opacity:.3}.stars button.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mut);font-size:.75rem}
.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpis div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh);font-size:.8rem;color:var(--mut)}.kpis b{display:block;font-size:1.6rem;color:var(--p)}
.help{font-size:.82rem;color:var(--mut);background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:8px 10px;margin:-2px 0 10px;white-space:pre-wrap}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 10px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:12px}.list .it:last-child{border-bottom:0}.list .it:hover{background:var(--bg)}
#loader{position:fixed;inset:0;background:rgba(20,15,40,.35);display:none;align-items:center;justify-content:center;z-index:99}
#loader .box{background:var(--card);color:var(--tx);border-radius:20px;padding:20px 26px;font-weight:700;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--bd);border-top-color:var(--p);animation:sp .9s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#1f1b33;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}.tst.err{background:var(--bad)}.tst.ok{background:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(20,15,40,.5);z-index:90;display:none;align-items:flex-end;justify-content:center}#modal.on{display:flex}
#modal .mb{background:var(--card);color:var(--tx);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px}
@media(min-width:700px){#modal{align-items:center}#modal .mb{border-radius:24px}}
#game{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column}#game.on{display:flex}
#game .gbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--p);color:#fff;font-weight:800}#game iframe{flex:1;border:0;width:100%;background:#fff}
.confetti{position:fixed;top:-40px;font-size:28px;z-index:101;animation:fall 2.2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.a11y{display:none;position:absolute;left:12px;top:64px;z-index:70;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:230px}
.a11y.on{display:block}.a11y button{width:100%;margin:3px 0;justify-content:flex-start}
#proj{position:fixed;inset:0;z-index:85;background:linear-gradient(135deg,#1e1b4b,#4c1d95);color:#fff;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{border-radius:20px;padding:12px;text-align:center;background:rgba(255,255,255,.1);border:3px solid transparent;font-weight:800;font-size:clamp(16px,2.4vw,26px)}.team.on{border-color:#fde047}.team b{font-size:clamp(34px,7vw,64px);display:block}
.pq{font-size:clamp(22px,3.8vw,42px);font-weight:800;text-align:center}.popts{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.popts{grid-template-columns:1fr}}
.popt{font-family:inherit;font-size:clamp(18px,2.8vw,32px);font-weight:700;padding:18px;border-radius:18px;border:0;background:#fff;color:#1e1b4b;cursor:pointer;text-align:right}
.popt.right{background:#22c55e;color:#fff}.popt.wrong{background:#ef4444;color:#fff}.popt.gone{visibility:hidden}
.pctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pctl button{font-size:16px;font-weight:700;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff}.pctl button.on{background:#fde047;color:#1e1b4b}
.ptimer{height:14px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}.ptimer i{display:block;height:100%;background:#fde047}
.ws{background:#fff;color:#000;padding:14px;border-radius:12px}.ws .wq{margin:10px 0;page-break-inside:avoid}.ws .ln{border-bottom:1px dotted #777;height:26px}
.cert{background:#fff;color:#1d1938;border:10px double var(--p);border-radius:20px;padding:30px;text-align:center}
.adm-tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0}
.hidden{display:none!important}
@media print{header.top,footer,.noprint,#toast{display:none!important}body{background:#fff;padding:0}main{padding:0;max-width:none}.card{box-shadow:none;border:0}}
/* ===== الإصدار ٢ ===== */
#slow{position:fixed;top:0;left:0;right:0;z-index:120;display:none;background:#fef3c7;color:#78350f;font-weight:800;text-align:center;padding:10px 14px;font-size:.88rem;box-shadow:0 4px 14px rgba(0,0,0,.12)}
#slow.on{display:block;animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.75}}
.sig{position:absolute;top:0;right:0;font-size:2px;color:var(--bg);opacity:.02;user-select:text;pointer-events:none;white-space:nowrap;overflow:hidden;max-width:100%}
main>*{animation:fadein .35s ease both}@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.hero{position:relative;overflow:hidden}
.hero .floaty{position:absolute;font-size:1.6rem;opacity:.12;animation:floaty 9s ease-in-out infinite;pointer-events:none}
@keyframes floaty{50%{transform:translateY(-14px) rotate(12deg)}}
.privacy{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--ok) 10%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 35%,transparent);color:var(--tx);border-radius:14px;padding:8px 12px;font-size:.8rem;margin-top:12px}
.rolechip{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:999px;padding:4px 12px;font-weight:800;font-size:.8rem;cursor:pointer;margin-top:8px}
.who{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.who .opt2{border:2px solid var(--bd);background:var(--card);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;transition:transform .15s,border-color .15s}
.who .opt2:hover{border-color:var(--p);transform:translateY(-2px)}.who .opt2 span{display:block;font-size:2rem}.who .opt2 b{display:block}.who .opt2 small{color:var(--mut);font-size:.74rem;line-height:1.4;display:block;margin-top:2px}
.journey{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px 14px;margin-top:12px;box-shadow:var(--sh)}
.ring{--v:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--v)*1%),var(--bd) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ring b{width:44px;height:44px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:.85rem}
.lcard .done{position:absolute;top:8px;left:8px;background:var(--ok);color:#fff;border-radius:99px;font-size:.66rem;padding:1px 8px;font-weight:800}
.guide3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}@media(max-width:520px){.guide3{grid-template-columns:1fr}}
.guide3 div{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:10px;font-size:.84rem}.guide3 b{display:block;font-size:1.3rem}
.wsopts{display:flex;flex-wrap:wrap;gap:8px;align-items:end;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.wsopts label{font-size:.75rem;font-weight:700}.wsopts input,.wsopts select{width:90px;margin:2px 0 0;padding:6px 8px}
.micro{font-size:4px;line-height:5px;color:#c9c9c9;letter-spacing:.3px;white-space:nowrap;overflow:hidden;margin-top:6px}
.wm{display:none}
@media print{.wm{display:block;position:fixed;top:45%;left:0;right:0;text-align:center;transform:rotate(-30deg);font-size:46px;font-weight:800;color:rgba(91,75,225,.045);pointer-events:none;z-index:0}#slow,.sig{display:none!important}}
.owner{text-align:center}.owner .fp{direction:ltr;font-family:monospace;background:var(--bg);border-radius:10px;padding:6px;font-size:.8rem;word-break:break-all}

.txt,.qt,.opt,.flash,.item b,.popt,.pq{unicode-bidi:plaintext}

    if (!quiet) load(true);
    var done = false; PENDING++;
    var timer = setTimeout(function () { if (!done) slowNotice(true); }, 20000);
    var fin = function () { done = true; clearTimeout(timer); PENDING = Math.max(0, PENDING - 1); if (!PENDING) slowNotice(false); };
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, payload: payload || {} }), redirect: 'follow' })
      .then(function (r) { return r.text(); })
      .then(function (t) { if (done) return; fin(); load(false); var o; try { o = JSON.parse(t); } catch (e) { rej('رد غير متوقع من الخادم (تأكد أن النشر «أي شخص» وأنك شغّلت setup): ' + String(t).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 160)); return; } if (o.ok) res(o.data); else { if (o.error === 'SESSION') { S.adm = null; ls('lab_adm', null); toast('انتهت جلسة المعلم، ادخل من جديد', 'err'); go('admin', {}, true); } rej(o.error); } })
      .catch(function (e) { if (done) return; fin(); load(false); rej('تعذّر الاتصال بالخادم — ' + ((e && e.message) || 'تحقق من الإنترنت')); });

}

var GAME = null;
function playGame(id) {
  var c = S.b.content.filter(function (x) { return x.id === id; })[0];
  var cached = null; try { cached = sessionStorage.getItem('g_' + id + '_' + S.b.v); } catch (e) {}
  var open = function (html) { GAME = { id: id, lesson: c.lesson, t0: Date.now(), preview: false }; $('gtitle').textContent = '🎮 ' + c.title; $('gframe').srcdoc = html; $('game').classList.add('on'); };
  if (cached) return open(cached);
  call('game', { id: id }).then(function (d) { try { sessionStorage.setItem('g_' + id + '_' + S.b.v, d.html); } catch (e) {} open(d.html); }).catch(function (e) { toast(e, 'err'); });
}
function previewGame(html, title) { GAME = { preview: true }; $('gtitle').textContent = '🎮 ' + title + ' (معاينة)'; $('gframe').srcdoc = bridgeLocal(html); $('game').classList.add('on'); }
function bridgeLocal(h) {
  var sc = '<script>(function(){window.PLATFORM={student:null};window.addEventListener("message",function(e){if(e.data&&e.data.type==="studentInfo"){window.PLATFORM.student=e.data.student;try{window.dispatchEvent(new CustomEvent("platformReady",{detail:e.data.student}))}catch(x){}}});try{parent.postMessage({type:"requestStudentInfo"},"*")}catch(x){}window.sendScore=function(s,t){try{parent.postMessage({type:"gameScore",score:s,total:t},"*")}catch(x){}};})();<\/script>';
  var m = /<head[^>]*>/i.exec(h); return m ? h.slice(0, m.index + m[0].length) + sc + h.slice(m.index + m[0].length) : sc + h;
}
function closeGame() { $('game').classList.remove('on'); $('gframe').srcdoc = ''; GAME = null; }
window.addEventListener('message', function (e) {
  var fr = $('gframe'); if (!GAME || !e.data || e.source !== fr.contentWindow) return;
  if (e.data.type === 'requestStudentInfo') { var nk = ls('lab_nick'); fr.contentWindow.postMessage({ type: 'studentInfo', student: nk ? { name: nk, section: section() } : null }, '*'); }
  if (e.data.type === 'gameScore') {
    var s = N(e.data.score), t = N(e.data.total);
    if (GAME.preview) return toast('نتيجة المعاينة: ' + s + ' من ' + t);
    if (GAME.sent) return; GAME.sent = true;
    track({ type: 'game', item: GAME.id, lesson: GAME.lesson, score: s, total: t, duration: (Date.now() - GAME.t0) / 1000 }, true);
    bump('games'); toast('👏 أحسنت! نتيجتك ' + s + ' من ' + t);
    setTimeout(function () { if (GAME) { GAME.sent = false; GAME.t0 = Date.now(); } }, 4000);
  }
});

  var w = 600, h = 180, pad = 26, mx = Math.max.apply(null, daily.map(function (d) { return Math.max(d.devs, d.part); })) || 1, n = daily.length;
  var X = function (i) { return pad + (n === 1 ? (w - 2 * pad) / 2 : i * (w - 2 * pad) / (n - 1)); }, Y = function (v) { return h - pad - v / mx * (h - 2 * pad); };
  var line = function (k, c) { return '<polyline fill="none" stroke="' + c + '" stroke-width="3" points="' + daily.map(function (d, i) { return X(i) + ',' + Y(d[k]); }).join(' ') + '"/>' + daily.map(function (d, i) { return '<circle cx="' + X(i) + '" cy="' + Y(d[k]) + '" r="3" fill="' + c + '"/>'; }).join(''); };
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" font-family="Tahoma" font-size="11" role="img"><line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) + '" stroke="#ccc"/>' + line('devs', '#5b4be1') + line('part', '#ff9f1c') +
    '<text x="' + pad + '" y="' + (h - 6) + '" fill="currentColor">' + daily[0].d.slice(5) + '</text><text x="' + (w - pad) + '" y="' + (h - 6) + '" text-anchor="end" fill="currentColor">' + daily[n - 1].d.slice(5) + '</text><text x="' + pad + '" y="14" fill="currentColor">' + mx + '</text></svg>' +
    '<div class="row mut" style="justify-content:center"><span style="color:#5b4be1">● زوار فريدون</span><span style="color:#ff9f1c">● مشاركات تفاعلية</span></div>';
}

  var k = id ? D().courses.filter(function (x) { return x.id === id; })[0] : { status: 'مسودة', year: '1448', subjectKey: 'science', gradeNo: '4', term: 'الفصل الدراسي الأول' };
  var terms = ['الفصل الدراسي الأول', 'الفصل الدراسي الثاني', 'الفصل الدراسي الثالث', 'العام كاملًا'];
  modal('<h3>' + (id ? '✏️ تعديل مقرر' : '➕ مقرر جديد') + '</h3>' +
    '<label class="f">نوع المادة</label><select id="k_sk" onchange="var s=SUBJECTS[this.value];$(\'k_s\').value=this.value===\'general\'?\'\':s.name;$(\'k_i\').value=s.icon;$(\'k_c\').value=s.color">' + Object.keys(SUBJECTS).map(function (x) { return '<option value="' + x + '"' + ((k.subjectKey || '') === x ? ' selected' : '') + '>' + SUBJECTS[x].icon + ' ' + SUBJECTS[x].name + '</option>'; }).join('') + '</select>' +
    '<div class="grid2"><div><label class="f">اسم المادة كما في الكتاب</label><input id="k_s" value="' + esc(k.subject || '') + '" placeholder="التوحيد، الفقه، الكيمياء…"></div><div><label class="f">الصف</label><select id="k_gn">' + Object.keys(GRADES).map(function (n) { return '<option value="' + n + '"' + (String(k.gradeNo) === n ? ' selected' : '') + '>' + GRADES[n].name + '</option>'; }).join('') + '</select></div>' +
    '<div><label class="f">الفصل الدراسي</label><select id="k_t">' + terms.map(function (t) { return '<option' + (k.term === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') + '</select></div><div><label class="f">الطبعة / العام</label><input id="k_y" value="' + esc(k.year || '') + '" placeholder="1448"></div>' +
    '<div><label class="f">الأيقونة</label><input id="k_i" value="' + esc(k.icon || subjOf(k).icon) + '"></div><div><label class="f">اللون</label><input id="k_c" type="color" value="' + esc(k.color || subjOf(k).color) + '" style="height:44px"></div></div>' +
    '<div class="grid2"><div><label class="f">العنوان (اختياري)</label><input id="k_ti" value="' + esc(k.title || '') + '" placeholder="يُكوَّن تلقائيًا"></div><div><label class="f">ترتيب الظهور</label><input id="k_o2" type="number" value="' + esc(k.order || '') + '"></div></div><label class="f">الحالة</label><select id="k_st">' + ['مسودة', 'منشور', 'أرشيف'].map(function (x) { return '<option value="' + x + '"' + (k.status === x ? ' selected' : '') + '>' + ({ 'مسودة': '🙈 مخفي (مسودة)', 'منشور': '👁️ ظاهر للجميع', 'أرشيف': '🗄️ أرشيف (مقرر سابق)' }[x]) + '</option>'; }).join('') + '</select>' +
    (id ? '' : '<div class="help">بعد الحفظ افتح «🪄 معالج الإنشاء»: يعطيك أوامر جاهزة تبني الدروس والمحتوى والأسئلة من كتابك.</div>') +
    '<div class="row"><button class="btn" onclick="saveCourse(\'' + (id || '') + '\')">💾 حفظ</button><button class="btn sec" onclick="closeModal()">إلغاء</button></div>');
  if (!id) { var s0 = SUBJECTS[k.subjectKey]; $('k_s').value = s0.name; }
};
saveCourse = function (id) {
  var gn = $('k_gn').value, s = $('k_s').value || SUBJECTS[$('k_sk').value].name;
  var d = { token: S.adm.token, id: id || undefined, subject: s, subjectKey: $('k_sk').value, gradeNo: gn, grade: GRADES[gn].name, term: $('k_t').value, year: $('k_y').value, icon: $('k_i').value, color: $('k_c').value, title: $('k_ti').value, status: $('k_st').value, order: $('k_o2').value };
  call('aSaveCourse', d).then(function (r) { S.adm.data = r.data; S.ac = r.id; closeModal(); toast('حُفظ المقرر ✅'); if (!id) go('a_wizard', {}, true); else render(); }).catch(function (e) { toast(e, 'err'); });
};

/* ======================= شعاع: المكتبة المشتركة والطلبات وروابط المقررات ======================= */
function callUrl(url, action, payload, quiet) {
  if (!url || url === API_URL) return call(action, payload, quiet);
  return new Promise(function (res, rej) {
    if (!quiet) load(true);
    fetch(url, { method: 'POST', body: JSON.stringify({ action: action, payload: payload || {} }), redirect: 'follow' }).then(function (r) { return r.text(); })
      .then(function (t) { load(false); var o; try { o = JSON.parse(t); } catch (e) { return rej('رد غير متوقع من المكتبة المركزية'); } if (o.ok) res(o.data); else rej(o.error); })
      .catch(function () { load(false); rej('تعذّر الاتصال بالمكتبة المركزية'); });
  });
}
function hubUrl() { return (D().settings.hubUrl || '').trim() || API_URL; }
function isHub() { return hubUrl() === API_URL; }
var HUB = null, HUBALL = null;
AP.a_hub = function (p) {
  if (admGuard()) return '';
  if (!HUB) { afterRender = function () { callUrl(hubUrl(), 'hubList', {}, true).then(function (d) { HUB = d.items; render(); }).catch(function (e) { HUB = []; toast(e, 'err'); render(); }); if (isHub() && canA('courses', 2)) call('aHubAll', { token: S.adm.token }, true).then(function (d) { HUBALL = d.items; render(); }).catch(function () {}); }; return admBar() + empty('جارٍ فتح المكتبة…'); }
  var tab = p.tab || 'browse', E = canA('courses', 2), pend = (HUBALL || []).filter(function (h) { return h.status === 'بانتظار المراجعة'; });
  var tb = function (k, l) { return '<span class="tab ' + (tab === k ? 'on' : '') + '" onclick="go(\'a_hub\',{tab:\'' + k + '\'},true)">' + l + '</span>'; };
  var h = admBar() + '<div class="hero"><h1>🌐 مكتبة شعاع المشتركة</h1><p>مقررات كاملة أعدها معلمون من الميدان: استوردها بضغطة، وشارك مقرراتك ليستفيد غيرك. ' + (isHub() ? 'منصتك هي المكتبة المركزية الآن.' : 'متصلة بالمكتبة المركزية.') + '</p></div><div class="tabs">' + tb('browse', '📚 تصفح واستورد') + (E ? tb('share', '📤 شارك مقررًا') : '') + (isHub() && E ? tb('review', '🛡️ اعتماد الحزم' + (pend.length ? ' (' + pend.length + ')' : '')) : '') + '</div>';
  if (tab === 'browse') {
    if (!HUB.length) return h + empty('لا توجد حزم معتمدة بعد — كن أول من يشارك');
    var by = {}; HUB.forEach(function (x) { (by[x.subject || 'أخرى'] = by[x.subject || 'أخرى'] || []).push(x); });
    return h + Object.keys(by).map(function (s) { return '<div class="chap">📚 ' + esc(s) + '</div>' + by[s].map(function (x) { return '<div class="card"><div class="row"><span style="font-size:1.8rem">' + ((SUBJECTS[x.subjectKey] || SUBJECTS.general).icon) + '</span><div class="sp"><b>' + esc(x.title) + '</b><div class="mut">' + esc(x.grade) + ' · ' + esc(x.term) + (x.year ? ' · طبعة ' + esc(x.year) : '') + ' · ' + x.lessons + ' درسًا · ' + x.questions + ' سؤالًا</div><div class="mut">✍️ ' + esc(x.author) + (x.school ? ' — ' + esc(x.school) : '') + ' · 📥 ' + N(x.downloads) + '</div>' + (x.desc ? '<div style="margin-top:4px">' + esc(x.desc) + '</div>' : '') + '</div><span class="pill ok">✅ معتمد</span></div>' + (E ? '<button class="btn sm" style="margin-top:8px" onclick="hubImport(\'' + x.id + '\')">📥 استورد إلى منصتي</button>' : '') + '</div>'; }).join(''); }).join('');
  }
  if (tab === 'share') return h + '<div class="card"><h3>📤 شارك مقررًا في المكتبة</h3><div class="help">تُرسل نسخة من المقرر (الدروس والمحتوى والأسئلة) للمكتبة المركزية، وتظهر للجميع بعد اعتماد المشرف. يبقى اسمك وملكيتك محفوظين، وتُنشر برخصة المشاع الإبداعي (غير تجاري).</div>' +
    '<label class="f">المقرر</label><select id="hs_k">' + admCourses().map(function (k) { return '<option value="' + k.id + '"' + (k.id === AC() ? ' selected' : '') + '>' + esc((k.icon || '') + ' ' + k.title) + '</option>'; }).join('') + '</select>' +
    '<div class="grid2"><div><label class="f">اسم المعدّ</label><input id="hs_a" value="' + esc(D().settings.teacherName || ME().name) + '"></div><div><label class="f">المدرسة</label><input id="hs_s" value="' + esc(D().settings.schoolName || '') + '"></div></div><label class="f">وسيلة تواصل (لا تظهر للعامة)</label><input id="hs_c" value="' + esc(D().settings.email || '') + '"><label class="f">وصف قصير</label><textarea id="hs_d" style="min-height:60px"></textarea><button class="btn big" onclick="hubShare()">📤 أرسل للمكتبة</button></div>';
  if (tab === 'review') return h + ((HUBALL || []).length ? (HUBALL || []).map(function (x) { return '<div class="card"><div class="row"><div class="sp"><b>' + esc(x.title) + '</b><div class="mut">' + esc(x.author) + ' — ' + esc(x.school) + ' · ' + esc(x.contact) + ' · ' + esc(x.submitted) + '</div><div class="mut">' + x.lessons + ' درسًا · ' + x.questions + ' سؤالًا</div></div><span class="pill ' + (x.status === 'معتمد' ? 'ok' : x.status === 'مرفوض' ? 'bad' : 'warn') + '">' + esc(x.status) + '</span></div><div class="row" style="margin-top:8px"><button class="btn sm ok" onclick="hubStatus(\'' + x.id + '\',\'معتمد\')">✅ اعتماد</button><button class="btn sm sec" onclick="hubStatus(\'' + x.id + '\',\'مرفوض\')">✖ رفض</button><button class="btn sm sec" onclick="hubImport(\'' + x.id + '\',true)">👁️ استيراد للمعاينة</button></div></div>'; }).join('') : empty('لا حزم مرسلة بعد'));
  return h;
};
function hubShare() {
  var k = $('hs_k').value, a = $('hs_a').value, sc = $('hs_s').value, c = $('hs_c').value, d = $('hs_d').value;
  call('aExportCourse', { token: S.adm.token, id: k }).then(function (r) { return callUrl(hubUrl(), 'hubSubmit', { json: r.json, author: a, school: sc, contact: c, desc: d, device: device() }); })
    .then(function () { HUB = null; HUBALL = null; modal('<div style="text-align:center"><div style="font-size:3rem">📤</div><h3>وصلت حزمتك للمكتبة</h3><div class="mut">ستظهر للجميع بعد اعتماد المشرف. شكرًا لإسهامك في الميدان 💜</div><br><button class="btn big" onclick="closeModal()">تم</button></div>'); render(); }).catch(function (e) { toast(e, 'err'); });
}
function hubImport(id, preview) {
  var go2 = function (j) { return preview ? Promise.resolve(j) : call('aImportCourse', { token: S.adm.token, json: j.json }); };
  (isHub() && preview ? call('aExportCourse', { token: S.adm.token, id: '__' }).catch(function () { return null; }) : Promise.resolve()).then(function () {
    return callUrl(hubUrl(), 'hubGet', { id: id });
  }).then(function (j) { return call('aImportCourse', { token: S.adm.token, json: j.json }); }).then(function (x) { S.adm.data = x.data; S.ac = x.id; toast('📥 استُورد المقرر «مسودة» — راجعه ثم انشره'); go('a_courses', {}, true); }).catch(function (e) { toast(e, 'err'); });
}
function hubStatus(id, st) { call('aHubStatus', { token: S.adm.token, id: id, status: st }).then(function (d) { HUBALL = d.items; HUB = null; toast('تم'); render(); }).catch(function (e) { toast(e, 'err'); }); }

/* ---------- طلبات «اطلب منصتك» ---------- */
var REQS = null;
AP.a_requests = function () {
  if (admGuard()) return '';
  if (!REQS) { afterRender = function () { call('aRequests', { token: S.adm.token }, true).then(function (d) { REQS = d.items; render(); }).catch(function (e) { toast(e, 'err'); }); }; return admBar() + empty('جارٍ التحميل…'); }
  var st = D().settings;
  return admBar() + '<div class="card"><h3>📨 طلبات «اطلب منصتك»</h3><div class="help">معلمون من مدارس أخرى يطلبون منصة مثل منصتك. عند القبول يصلهم بريد فيه «حزمة التشغيل».\nالقبول التلقائي: ' + (st.autoApprove === 'نعم' ? 'مفعّل ✅' : 'متوقف') + ' · رابط الحزمة: ' + (st.kitUrl ? 'مضبوط ✅' : '<b>غير مضبوط — ضعه من الإعدادات</b>') + '</div></div>' +
    (REQS.length ? REQS.map(function (r) { return '<div class="card"><div class="row"><div class="sp"><b>' + esc(r.name) + '</b> <span class="mut">' + esc(r.time) + '</span><div class="mut">🏫 ' + esc(r.school) + ' · ' + esc(r.city) + ' · 📚 ' + esc(r.subject) + ' ' + esc(r.grade) + '</div><div class="mut">✉️ ' + esc(r.email) + '</div>' + (r.notes ? '<div>' + esc(r.notes) + '</div>' : '') + (r.reply ? '<div class="mut">↩️ ' + esc(r.reply) + '</div>' : '') + '</div><span class="pill ' + (r.status === 'مقبول' ? 'ok' : r.status === 'مرفوض' ? 'bad' : 'warn') + '">' + esc(r.status) + '</span></div>' +
      (canA('users', 2) ? '<div class="row" style="margin-top:8px"><button class="btn sm ok" onclick="reqStatus(\'' + r.id + '\',\'مقبول\',true)">✅ قبول وإرسال الحزمة</button><button class="btn sm sec" onclick="reqStatus(\'' + r.id + '\',\'مقبول\',false)">✔ قبول دون بريد</button><button class="btn sm sec" onclick="reqStatus(\'' + r.id + '\',\'مرفوض\')">✖ رفض</button></div>' : '') + '</div>'; }).join('') : empty('لا طلبات بعد'));
};
function reqStatus(id, st, send) { call('aRequestStatus', { token: S.adm.token, id: id, status: st, send: !!send }).then(function (d) { REQS = d.items; toast(send ? '✉️ أُرسلت الحزمة' : 'تم'); render(); }).catch(function (e) { toast(e, 'err'); }); }

/* ---------- روابط المقرر (عام ومقيّد) ---------- */
function courseLinks(id) {
  var k = D().courses.filter(function (x) { return x.id === id; })[0], base = (D().settings.siteUrl || (location.origin + location.pathname)).replace(/#.*$/, '');
  var u1 = base + '#course=' + id, u2 = base + '#course=' + id + '&only=1', qr = function (u) { return 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data=' + encodeURIComponent(u); };
  modal('<h3>🔗 روابط «' + esc(k.title) + '»</h3>' +
    '<div class="card"><b>🔒 رابط مقيّد بهذا المقرر (للطلاب)</b><div class="mut">يفتح المقرر مباشرة دون مكتبة المقررات ولا زر التغيير — فلا يتشتت الطالب</div><div class="row" style="margin-top:6px"><input readonly dir="ltr" value="' + esc(u2) + '" style="flex:1;margin:0"><button class="btn sm" onclick="copyText(' + q(u2) + ',\'نُسخ ✅\')">📋</button></div><img src="' + qr(u2) + '" width="140" height="140" style="margin-top:8px;border-radius:10px;background:#fff" alt="QR"></div>' +
    '<div class="card"><b>🌐 رابط المقرر العام</b><div class="mut">يفتح المقرر مع إمكانية تصفح بقية المقررات</div><div class="row" style="margin-top:6px"><input readonly dir="ltr" value="' + esc(u1) + '" style="flex:1;margin:0"><button class="btn sm" onclick="copyText(' + q(u1) + ',\'نُسخ ✅\')">📋</button></div></div>' +
    (k.status !== 'منشور' ? '<div class="pill warn">المقرر غير منشور الآن — الروابط تعمل بعد نشره</div>' : '') + '<button class="btn sec big" onclick="closeModal()">إغلاق</button>');
}

(function () { try { var t = sessionStorage.getItem('lab_adm'); if (t) { call('aData', { token: t }, true).then(function (d) { S.adm = { token: t, data: d }; }).catch(function () { sessionStorage.removeItem('lab_adm'); }); } } catch (e) {} })();
try { boot(); } catch (e) { showFatal('boot: ' + (e && e.message)); }

</script>
