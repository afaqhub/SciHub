<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مختبر العلوم الرقمي — العلوم للصف الرابع</title>
<meta name="description" content="منصة إثرائية مفتوحة لمادة العلوم للصف الرابع الابتدائي: شروح، ومراجعات تفاعلية، وألعاب، وأوراق عمل — بلا تسجيل ولا بيانات شخصية.">
<meta name="theme-color" content="#5b4be1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#5b4be1;--a:#ff9f1c;--bg:#f5f3fd;--card:#fff;--tx:#1d1938;--mut:#6f6a8f;--bd:#e9e5fa;--ok:#16a34a;--bad:#e11d48;--warn:#f59e0b;--sh:0 2px 10px rgba(60,40,150,.06),0 8px 24px rgba(60,40,150,.05);--r:20px;--fs:16.5px}
body.dark{--bg:#12101c;--card:#1d1a2c;--tx:#f1eeff;--mut:#a7a2c4;--bd:#2c2745;--sh:none}
body.hc{--bg:#fff;--card:#fff;--tx:#000;--mut:#222;--bd:#000;--p:#2a1fb0;--sh:none}
body.hc .card,body.hc .lcard,body.hc .tile{border-width:2px}
body.hc.dark{--bg:#000;--card:#000;--tx:#fff;--mut:#eee;--bd:#fff;--p:#ffd400}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);line-height:1.65;min-height:100vh;padding-bottom:30px}
a{color:var(--p)}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
button{font-family:inherit}
header.top{background:linear-gradient(120deg,var(--p),#8b5cf6);color:#fff;padding:12px 16px 16px;border-radius:0 0 26px 26px}
.top .row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{width:50px;height:50px;border-radius:14px;background:#fff;object-fit:contain;padding:3px;flex-shrink:0}
.top .title{font-size:1.15rem;font-weight:800;line-height:1.3}.top .school{font-size:.72rem;opacity:.9}
.icobtn{width:40px;height:40px;border:0;border-radius:12px;background:rgba(255,255,255,.2);color:#fff;font-size:17px;cursor:pointer}
main{max-width:860px;margin:0 auto;padding:14px}
footer{max-width:860px;margin:10px auto 0;text-align:center;color:var(--mut);font-size:.78rem;padding:16px}
footer a{cursor:pointer;margin:0 6px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h2,.card h3{margin:0 0 8px}h2{font-size:1.2rem}h3{font-size:1.02rem}
.mut{color:var(--mut);font-size:.85rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--p);color:#fff;border:0;border-radius:14px;padding:10px 16px;font-size:.95rem;font-weight:700;cursor:pointer;text-decoration:none}
.btn.sec{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}.btn.acc{background:var(--a)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 11px;font-size:.82rem;border-radius:11px}.btn.big{width:100%;padding:14px;font-size:1.05rem;margin:6px 0}
input,select,textarea{font-family:inherit;font-size:.95rem;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
textarea{min-height:90px;resize:vertical}textarea.code{direction:ltr;font-family:monospace;font-size:12px;min-height:220px}
input[type=checkbox],input[type=radio]{width:auto;margin:0 0 0 6px}
label.f{font-weight:700;font-size:.88rem;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.stitle{display:flex;justify-content:space-between;align-items:center;margin:20px 4px 8px;font-weight:800;font-size:1.02rem}.stitle a{font-size:.8rem;cursor:pointer;font-weight:700}
.hero{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.hero h1{margin:0;font-size:1.45rem;line-height:1.35}.hero p{margin:6px 0 0;color:var(--mut)}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.role{border:2px solid var(--bd);background:var(--bg);border-radius:16px;padding:10px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:.9rem}
.role span{display:block;font-size:1.6rem}.role.on{border-color:var(--p);background:color-mix(in srgb,var(--p) 10%,var(--card));color:var(--p)}
.week{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,var(--p),#8b5cf6);color:#fff;border-radius:22px;padding:18px;cursor:pointer;box-shadow:0 10px 24px rgba(91,75,225,.25)}
.week .wi{font-size:2.3rem;background:rgba(255,255,255,.18);border-radius:16px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.week b{font-size:1.15rem;display:block}.week small{opacity:.9}
.counters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.counters div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:10px;text-align:center;font-size:.78rem;color:var(--mut);box-shadow:var(--sh)}.counters b{display:block;font-size:1.4rem;color:var(--p)}
.unit{margin-bottom:16px}.unit>h3{display:flex;align-items:center;gap:8px;margin:0 4px 6px}
.chap{font-size:.82rem;color:var(--mut);font-weight:700;margin:10px 4px 6px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lcard{position:relative;background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--c,var(--p));border-radius:18px;padding:12px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s}
.lcard:active{transform:scale(.97)}.lcard .li{font-size:1.7rem}.lcard b{display:block;font-size:.95rem;line-height:1.35;margin:2px 0}
.lcard small{color:var(--mut);font-size:.72rem}.lcard .soon{position:absolute;top:8px;left:8px;font-size:.66rem;background:var(--bg);border:1px solid var(--bd);border-radius:99px;padding:0 7px}
.lhead{background:linear-gradient(120deg,var(--p),#8b5cf6);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:12px}
.lhead .crumb{font-size:.78rem;opacity:.9}.lhead h1{margin:4px 0;font-size:1.4rem}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.tab{white-space:nowrap;padding:8px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);cursor:pointer;font-weight:800;font-size:.88rem}
.tab.on{background:var(--p);color:#fff;border-color:var(--p)}
.item{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.item .ih{display:flex;align-items:center;gap:10px;margin-bottom:8px}.item .ih .ic{font-size:1.5rem}.item .ih b{flex:1}
.embed{position:relative;padding-top:56.25%;border-radius:14px;overflow:hidden;background:#000}.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.embed.doc{padding-top:120%;background:var(--bg)}
.txt{white-space:pre-wrap;line-height:1.9}.txt ul{margin:0;padding-right:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:800;box-shadow:var(--sh)}
.tile .ic{display:block;font-size:2rem;margin-bottom:4px}.tile small{display:block;color:var(--mut);font-weight:500;font-size:.75rem}
.q{margin:12px 0;padding:12px;border-radius:14px;background:var(--bg);border:1px solid var(--bd)}.qt{font-weight:800;margin-bottom:8px}
.opt{display:flex;align-items:center;padding:11px 13px;margin:7px 0;border-radius:13px;border:2px solid var(--bd);background:var(--card);cursor:pointer;font-weight:600}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--card))}
.bar{height:10px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--p);transition:width .3s}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.72rem;font-weight:700;background:var(--bg);border:1px solid var(--bd)}
.pill.ok{background:#dcfce7;color:#166534;border-color:#bbf7d0}.pill.warn{background:#fef3c7;color:#92400e;border-color:#fde68a}.pill.bad{background:#ffe4e6;color:#9f1239;border-color:#fecdd3}
.flash{min-height:210px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.25rem;font-weight:700;cursor:pointer;border-radius:22px;padding:22px;background:var(--card);border:3px solid var(--p);white-space:pre-wrap;user-select:none}
.flash.back{background:var(--p);color:#fff}
.chal .opt{font-weight:700}
.boardrow{display:flex;align-items:center;gap:10px;margin:8px 0}.boardrow b{min-width:48px}
.stars{display:flex;gap:6px;justify-content:center;direction:ltr}.stars button{font-size:2rem;background:none;border:0;cursor:pointer;opacity:.3}.stars button.on{opacity:1}
table{width:100%;border-collapse:collapse;font-size:.85rem}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mut);font-size:.75rem}
.tw{overflow-x:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpis div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;text-align:center;box-shadow:var(--sh);font-size:.8rem;color:var(--mut)}.kpis b{display:block;font-size:1.6rem;color:var(--p)}
.help{font-size:.82rem;color:var(--mut);background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:8px 10px;margin:-2px 0 10px;white-space:pre-wrap}
.list .it{display:flex;align-items:center;gap:10px;padding:11px 10px;border-bottom:1px solid var(--bd);cursor:pointer;border-radius:12px}.list .it:last-child{border-bottom:0}.list .it:hover{background:var(--bg)}
#loader{position:fixed;inset:0;background:rgba(20,15,40,.35);display:none;align-items:center;justify-content:center;z-index:99}
#loader .box{background:var(--card);color:var(--tx);border-radius:20px;padding:20px 26px;font-weight:700;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:5px solid var(--bd);border-top-color:var(--p);animation:sp .9s linear infinite;margin:0 auto 10px}@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.tst{background:#1f1b33;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.25)}.tst.err{background:var(--bad)}.tst.ok{background:var(--ok)}
#modal{position:fixed;inset:0;background:rgba(20,15,40,.5);z-index:90;display:none;align-items:flex-end;justify-content:center}#modal.on{display:flex}
#modal .mb{background:var(--card);color:var(--tx);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px}
@media(min-width:700px){#modal{align-items:center}#modal .mb{border-radius:24px}}
#game{position:fixed;inset:0;background:#000;z-index:80;display:none;flex-direction:column}#game.on{display:flex}
#game .gbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--p);color:#fff;font-weight:800}#game iframe{flex:1;border:0;width:100%;background:#fff}
.confetti{position:fixed;top:-40px;font-size:28px;z-index:101;animation:fall 2.2s linear forwards;pointer-events:none}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.6}}
.a11y{display:none;position:absolute;left:12px;top:64px;z-index:70;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);width:230px}
.a11y.on{display:block}.a11y button{width:100%;margin:3px 0;justify-content:flex-start}
#proj{position:fixed;inset:0;z-index:85;background:linear-gradient(135deg,#1e1b4b,#4c1d95);color:#fff;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:12px}.team{border-radius:20px;padding:12px;text-align:center;background:rgba(255,255,255,.1);border:3px solid transparent;font-weight:800;font-size:clamp(16px,2.4vw,26px)}.team.on{border-color:#fde047}.team b{font-size:clamp(34px,7vw,64px);display:block}
.pq{font-size:clamp(22px,3.8vw,42px);font-weight:800;text-align:center}.popts{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.popts{grid-template-columns:1fr}}
.popt{font-family:inherit;font-size:clamp(18px,2.8vw,32px);font-weight:700;padding:18px;border-radius:18px;border:0;background:#fff;color:#1e1b4b;cursor:pointer;text-align:right}
.popt.right{background:#22c55e;color:#fff}.popt.wrong{background:#ef4444;color:#fff}.popt.gone{visibility:hidden}
.pctl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.pctl button{font-size:16px;font-weight:700;border:0;border-radius:14px;padding:10px 14px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff}.pctl button.on{background:#fde047;color:#1e1b4b}
.ptimer{height:14px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}.ptimer i{display:block;height:100%;background:#fde047}
.ws{background:#fff;color:#000;padding:14px;border-radius:12px}.ws .wq{margin:10px 0;page-break-inside:avoid}.ws .ln{border-bottom:1px dotted #777;height:26px}
.cert{background:#fff;color:#1d1938;border:10px double var(--p);border-radius:20px;padding:30px;text-align:center}
.adm-tabs{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0}
.hidden{display:none!important}
@media print{header.top,footer,.noprint,#toast{display:none!important}body{background:#fff;padding:0}main{padding:0;max-width:none}.card{box-shadow:none;border:0}}
</style>
</head>
<body>
<div id="loader"><div class="box"><div class="spin"></div>لحظات…</div></div>
<div id="toast"></div>
<div id="modal" onclick="if(event.target===this)closeModal()"><div class="mb" id="mbody"></div></div>
<div id="game"><div class="gbar"><button class="icobtn" onclick="closeGame()">→ رجوع</button><span id="gtitle" style="flex:1"></span></div><iframe id="gframe" sandbox="allow-scripts" title="لعبة تعليمية"></iframe></div>
<div id="app"></div>
<script>window.addEventListener("error",function(e){var a=document.getElementById("app");if(a&&!a.innerHTML.trim()){a.innerHTML='<div style="max-width:560px;margin:30px auto;padding:18px;border-radius:18px;background:#fff;color:#000;border:2px solid #e11d48;font-family:Tahoma;direction:rtl"><b>⚠️ متصفحك لم يستطع تشغيل الصفحة</b><br>جرّب فتح الرابط في Chrome، أو صوّر هذه الرسالة:<pre style="white-space:pre-wrap;direction:ltr;font-size:12px">'+String(e.message).replace(/[<>&]/g,"")+" @"+e.lineno+"</pre></div>"}});</script>
<script>
/* إظهار أي خطأ على الشاشة بدل الصفحة البيضاء */
function showFatal(msg) {
  try {
    var a = document.getElementById('app'); if (!a) return;
    a.innerHTML = '<div style="max-width:560px;margin:30px auto;padding:18px;border-radius:18px;background:#fff;color:#1d1938;border:2px solid #e11d48;font-family:Tahoma,Arial;direction:rtl"><h3 style="margin-top:0">⚠️ تعذّر عرض الصفحة</h3><div>صوّر هذه الرسالة وأرسلها للدعم الفني:</div><pre style="white-space:pre-wrap;direction:ltr;background:#f5f5f5;padding:10px;border-radius:10px;font-size:12px">' + String(msg).replace(/[<>&]/g, '') + '</pre><button onclick="try{localStorage.clear()}catch(e){};location.reload()" style="padding:10px 16px;border-radius:12px;border:0;background:#5b4be1;color:#fff;font-weight:bold">🔄 مسح الذاكرة وإعادة المحاولة</button></div>';
  } catch (e) {}
}
window.onerror = function (m, src, line, col) { if (!document.getElementById('app') || !document.getElementById('app').innerHTML.trim()) showFatal(m + ' @' + line + ':' + col); };

function call(action, payload, quiet) {
  return new Promise(function (res, rej) {
    if (!API_URL || API_URL.indexOf('PASTE_') === 0) { rej('لم يُضبط رابط الخادم (API_URL) في أعلى الملف'); return; }
    if (!quiet) load(true);
    var done = false, timer = setTimeout(function () { if (!done) { done = true; load(false); rej('الخادم لم يستجب خلال ٣٠ ثانية — تحقق من الإنترنت أو من نشر Apps Script'); } }, 30000);
    fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: action, payload: payload || {} }), redirect: 'follow' })
      .then(function (r) { return r.text(); })
      .then(function (t) { if (done) return; done = true; clearTimeout(timer); load(false); var o; try { o = JSON.parse(t); } catch (e) { rej('رد غير متوقع من الخادم (تأكد أن النشر «أي شخص» وأنك شغّلت setup): ' + String(t).replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').slice(0, 160)); return; } if (o.ok) res(o.data); else { if (o.error === 'SESSION') { S.adm = null; ls('lab_adm', null); toast('انتهت جلسة المعلم، ادخل من جديد', 'err'); go('admin', {}, true); } rej(o.error); } })
      .catch(function (e) { if (done) return; done = true; clearTimeout(timer); load(false); rej('تعذّر الاتصال بالخادم — ' + ((e && e.message) || 'تحقق من الإنترنت')); });
  });
}

function device() { var d = ls('lab_dev'); if (!d) { d = 'd' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10); ls('lab_dev', d); } return d; }

function section() { return ls('lab_sec') || ''; }
var QUEUE = J(ls('lab_q'), []) || [];
function track(e, now) {
  if (S.adm) return;
  QUEUE.push(e); if (QUEUE.length > 200) QUEUE = QUEUE.slice(-200);
  ls('lab_q', JSON.stringify(QUEUE));
  if (now) return flush();
}
function payload_() { var ev = QUEUE.splice(0, 40); ls('lab_q', JSON.stringify(QUEUE)); return { device: device(), role: role(), section: section(), events: ev }; }
function flush() {
  if (!QUEUE.length || !API_URL || API_URL.indexOf('PASTE_') === 0) return Promise.resolve(null);
  var p = payload_();
  return call('track', p, true).catch(function () { QUEUE = p.events.concat(QUEUE); ls('lab_q', JSON.stringify(QUEUE)); return null; });
}
function beacon() {
  if (!QUEUE.length || !navigator.sendBeacon || !API_URL || API_URL.indexOf('PASTE_') === 0) return;

}

    '<h3>٢. الأثر التعليمي</h3><div class="txt">' + fmtText((s.improvement.pairs ? '- ارتفع متوسط إتقان الطلاب من **' + s.improvement.first + '%** في المحاولة الأولى إلى **' + s.improvement.last + '%** في المحاولة الأخيرة (' + s.improvement.pairs + ' حالة مراجعة متكررة).\n' : '') + (s.phase.beforeN && s.phase.afterN ? '- متوسط الإجابات قبل شرح الدرس **' + s.phase.before + '%** مقابل **' + s.phase.after + '%** بعده.\n' : '') + (t.avgMinutes ? '- متوسط مدة النشاط الواحد ' + t.avgMinutes + ' دقيقة.\n' : '') + '- تُحدَّد أصعب الأسئلة آليًا لتوجيه المعلم إلى المفاهيم التي تحتاج إعادة شرح.') + '</div>' +
    '<h3>٣. النشاط اليومي</h3>' + lineSvg(s.daily) +
    '<h3>٤. الدروس الأكثر استخدامًا</h3>' + barsSvg(s.lessons) +
    '<h3>٥. الإتقان في مراجعات الدروس</h3>' + barsSvg(s.reviewsBy, { pct: true, max: 100 }) +
    (s.hardest.length ? '<h3>٦. المفاهيم الأصعب</h3>' + barsSvg(s.hardest.slice(0, 6).map(function (x) { return { l: x.q, v: x.v }; }), { pct: true, max: 100 }) : '') +
    '<h3>٧. حجم المحتوى المنشور</h3><div class="txt">' + fmtText('- ' + L.length + ' درسًا مرتبطًا بالكتاب المقرر، و' + C.length + ' موردًا رقميًا منشورًا:\n' + Object.keys(types).map(function (k) { return '- ' + k + ': ' + types[k]; }).join('\n') + '\n- بنك أسئلة تفاعلي يغذي المراجعات وأوراق العمل وتحدي الفرق تلقائيًا.') + '</div>' +
    (s.roles.length ? '<h3>٨. الفئات المستفيدة</h3>' + barsSvg(s.roles, { color: '#10b981' }) : '') +
    (s.feedback.quotes.length ? '<h3>٩. من آراء المستفيدين</h3>' + s.feedback.quotes.map(function (f) { return '<blockquote style="border-right:4px solid #ff9f1c;margin:8px 0;padding:6px 12px;background:#fff7ed">«' + esc(f.text) + '» <small>— ' + esc(f.role || 'زائر') + (f.rating ? ' ' + '⭐'.repeat(N(f.rating)) : '') + '</small></blockquote>'; }).join('') : '') +
    '<h3>١٠. الخصوصية بالتصميم</h3><div class="txt">' + fmtText('- لا تسجيل، ولا أسماء، ولا بيانات شخصية لأي مستفيد؛ معرّف عشوائي محلي لعدّ الزوار فقط.\n- كل المؤشرات أعلاه مجمّعة ومجهولة المصدر.\n- كلفة التشغيل صفر: Google Sheets + Apps Script + GitHub Pages.\n- ' + st.license) + '</div>' +
    '<div style="border-top:2px solid #5b4be1;margin-top:16px;padding-top:6px;font-size:12px;text-align:center">إعداد/ ' + esc(st.teacherName) + ' — ' + esc(st.email) + '</div></div>';
};

(function () { try { var t = sessionStorage.getItem('lab_adm'); if (t) { call('aData', { token: t }, true).then(function (d) { S.adm = { token: t, data: d }; }).catch(function () { sessionStorage.removeItem('lab_adm'); }); } } catch (e) {} })();
try { boot(); } catch (e) { showFatal('boot: ' + (e && e.message)); }
